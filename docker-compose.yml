# Muzdyq — one-command local / small-server deployment.
#
#   docker compose up --build
#   open http://localhost:8080
#
# The stack is intentionally small: PostGIS + FastAPI + nginx-served PWA.
# Everything is account-free; the only secret is the moderation token.
#
# Copy .env.example to .env to override values. Compose also works with the
# defaults below, which are fine for a local demo but must be changed on a
# public host.

name: muzdyq

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-muzdyq}
      POSTGRES_USER: ${POSTGRES_USER:-muzdyq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-muzdyq}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-muzdyq}:${POSTGRES_PASSWORD:-muzdyq}@db:5432/${POSTGRES_DB:-muzdyq}
      MEDIA_ROOT: /data/media
      AUTO_CREATE_SCHEMA: "false"
      SEED_ON_STARTUP: "true"
      SEED_DEMO: ${SEED_DEMO:-true}
      SEED_REFERENCES: "true"
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token-change-me}
      IP_HASH_SALT: ${IP_HASH_SALT:-dev-salt-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      TRUST_PROXY_HEADERS: "true"
      UPLOAD_LIMIT_PER_HOUR: ${UPLOAD_LIMIT_PER_HOUR:-40}
      UPLOAD_LIMIT_PER_MINUTE: ${UPLOAD_LIMIT_PER_MINUTE:-6}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - media-data:/data/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    ports:
      # Optional direct API access for debugging. The frontend proxies /api.
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  db-data:
  media-data:
