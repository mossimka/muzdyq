name: Bug report
description: Something is broken or behaves unexpectedly.
title: "[bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Do not include personal data, photos of people,
        API tokens or security vulnerabilities here.** Security issues go through
        the private Security tab (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the actual behaviour and what you expected instead.
      placeholder: "Opening a point on a 360 px phone shows ..."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open /
        2. Tap a point card
        3. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Map / point panel
        - Gallery / compare / timelapse
        - Capture / ghost overlay
        - Offline queue / sync
        - Exports
        - Localisation (kk/ru/en)
        - Accessibility / dark mode
        - Backend API
        - Docker / deployment
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, browser/version, Node/Python, Docker or local, commit hash.
      placeholder: "Android 14 / Chrome 131 · local dev · commit abc1234"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Paste text logs rather than screenshots when possible. Remove personal data.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: This report contains no personal data, secrets or security details.
          required: true
