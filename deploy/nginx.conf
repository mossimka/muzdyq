# Public-host configuration example for Muzdyq.
#
# docker compose uses frontend/nginx.conf inside the frontend container.
# Use this file when you terminate TLS on the host (Caddy/Traefik/nginx) or in
# front of the compose stack. Replace muzdyq.example.org and the certificate
# paths before deploying.
#
# Key points:
#   * enforce HTTPS and HSTS;
#   * keep a generous client_max_body_size for phone photos;
#   * never cache /sw.js, /index.html or API responses;
#   * allow long-lived caching only for fingerprinted /assets/ files.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream muzdyq_app {
    server 127.0.0.1:8080;  # frontend container published port
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name muzdyq.example.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name muzdyq.example.org;

    ssl_certificate     /etc/letsencrypt/live/muzdyq.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/muzdyq.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 20m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self)" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/manifest+json image/svg+xml application/geo+json;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location /api/ {
        proxy_pass http://muzdyq_app;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass http://muzdyq_app;
    }

    location /assets/ {
        proxy_pass http://muzdyq_app;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /sw.js {
        proxy_pass http://muzdyq_app;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        proxy_pass http://muzdyq_app;
    }
}
